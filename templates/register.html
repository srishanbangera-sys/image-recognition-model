<!DOCTYPE html>
<html>
<head>
    <title>Register Person</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        input, textarea, button {
            box-sizing: border-box;
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #006ae6;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register Person</h2>
        <form action="/register" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Name" required>
            <input type="number" name="age" placeholder="Age" min="0" required>
            <input type="text" name="job" placeholder="Job" required>
            <input type="tel" name="phone" placeholder="Phone" required>
            <textarea name="address" placeholder="Address" rows="3" required></textarea>
            <input type="file" name="photos" accept="image/*" multiple required>
            <button type="submit">Register</button>
        </form>
        <a href="/recognize">Recognize a Person</a>
    </div>
</body>
</html>
